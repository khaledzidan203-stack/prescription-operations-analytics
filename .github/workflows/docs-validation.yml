name: Analytical and documentation validation

on:
  pull_request:
  push:
    branches:
      - main
      - portfolio-v1.1.0-upgrade

permissions:
  contents: read

jobs:
  test:
    name: Prescription operations analytical quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" "pandas>=2.2,<3"

      - name: Validate repository contract
        run: python scripts/validate_repository.py

      - name: Run analytical and publication tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m py_compile app.py src/analytics.py src/data_quality.py scripts/validate_repository.py tests/test_analytics.py tests/test_sample_baseline.py
